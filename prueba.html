    <title>SVG con Glitter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at center, #2b2b35 0%, #111116 70%);
        }

        .contenedor {
            width: min(90%, 1400px);
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        /* =========================
       LOGO
    ========================= */

        .cls-1 {
            fill: url(#linear-gradient-2);
        }

        .cls-2 {
            fill: url(#linear-gradient);
        }

        .logo-path {
            transition: filter 0.4s ease;
        }

        .logo-path:hover {
            filter: brightness(1.3) drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
        }

        /* =========================
       ESTRELLAS
    ========================= */

        .sparkle {
            fill: white;
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
            animation: sparkle 2.5s infinite ease-in-out;
        }

        .sparkle-1 {
            animation-delay: 0s;
        }

        .sparkle-2 {
            animation-delay: 0.8s;
        }

        .sparkle-3 {
            animation-delay: 1.4s;
        }

        .sparkle-4 {
            animation-delay: 2s;
        }

        .sparkle-5 {
            animation-delay: 0.4s;
        }

        .sparkle-6 {
            animation-delay: 1.7s;
        }

        @keyframes sparkle {
            0% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }

            20% {
                opacity: 1;
            }

            50% {
                opacity: 1;
                transform: scale(1.4) rotate(90deg);
            }

            80% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: scale(0) rotate(180deg);
            }
        }

        /* =========================
       PARTICULAS
    ========================= */

        .particle {
            fill: white;
            opacity: 0;
            animation: particleFloat 4s infinite ease-in-out;
        }

        .particle-1 {
            animation-delay: 0s;
        }

        .particle-2 {
            animation-delay: 1s;
        }

        .particle-3 {
            animation-delay: 2s;
        }

        .particle-4 {
            animation-delay: 3s;
        }

        .particle-5 {
            animation-delay: 1.5s;
        }

        .particle-6 {
            animation-delay: 2.5s;
        }

        @keyframes particleFloat {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }

            20% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
                transform: translateY(-10px);
            }

            80% {
                opacity: 0.5;
            }

            100% {
                opacity: 0;
                transform: translateY(-25px);
            }
        }

        /* =========================
       BRILLO DEL LOGO
    ========================= */

        .shine {
            mix-blend-mode: screen;
            animation: shineMove 5s infinite linear;
            opacity: 0.7;
        }

        @keyframes shineMove {
            0% {
                transform: translateX(-1600px);
            }

            100% {
                transform: translateX(1600px);
            }
        }

        /* =========================
       TEXTO
    ========================= */

        .instruccion {
            position: fixed;
            bottom: 30px;
            color: rgba(255, 255, 255, 0.45);
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
        }
    </style>

    <script>

        /*
        ========================================
        EFECTO INTERACTIVO CON EL MOUSE
        ========================================
    
        Hace que las estrellas tengan un pequeño
        desplazamiento dependiendo de la posición
        del cursor.
        */

        const svg = document.querySelector("#Capa_1");

        svg.addEventListener("mousemove", (event) => {

            const rect = svg.getBoundingClientRect();

            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const moveX = (x - centerX) / 80;
            const moveY = (y - centerY) / 80;

            document.querySelectorAll(".sparkle").forEach((star, index) => {

                const factor = (index + 1) * 0.15;

                star.style.translate =
                    `${moveX * factor}px ${moveY * factor}px`;

            });

        });

        svg.addEventListener("mouseleave", () => {

            document.querySelectorAll(".sparkle").forEach((star) => {

                star.style.translate = "0px 0px";

            });

        });

    </script>
